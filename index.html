<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beyond — Travel &amp; Lifestyle Concierge Membership</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #2f3a44;         /* deep slate for readable text on light areas */
    --cream: #f7f1e2;       /* the script color from the artwork */
    --sky: #b9c9d6;         /* the linen blue of the artwork */
    --line: rgba(247,241,226,0.55);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{ height:100%; }

  body{
    font-family:'Jost', sans-serif;
    color:var(--cream);
    background:#a8bac9;
    min-height:100vh;
    overflow-x:hidden;
  }

  .backdrop{
    position:fixed;
    inset:0;
    background-image:url('backgroundimage.png');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    z-index:-2;
  }

  .backdrop::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(20,30,40,0.32) 0%, rgba(20,30,40,0.12) 30%, rgba(20,30,40,0.28) 78%, rgba(20,30,40,0.55) 100%);
  }

  .page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }

  /* ---------- NAV ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    padding:36px 48px;
    flex-wrap:wrap;
  }

  .logo{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size:1.6rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    text-decoration:none;
    color:var(--cream);
  }

  nav{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
  }

  /* ---------- BUTTONS ---------- */
  .btn{
    display:inline-block;
    font-family:'Jost', sans-serif;
    font-size:0.72rem;
    font-weight:500;
    letter-spacing:0.22em;
    text-transform:uppercase;
    text-decoration:none;
    color:var(--cream);
    padding:14px 30px;
    border:1px solid var(--line);
    border-radius:2px;
    background:transparent;
    transition:background 0.35s ease, color 0.35s ease, border-color 0.35s ease;
    white-space:nowrap;
  }

  .btn:hover{
    background:var(--cream);
    color:#3a4552;
    border-color:var(--cream);
  }

  .btn-solid{
    background:var(--cream);
    color:#3a4552;
    border-color:var(--cream);
  }

  .btn-solid:hover{
    background:transparent;
    color:var(--cream);
    border-color:var(--line);
  }

  /* ---------- HERO ---------- */
  .hero{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 24px;
  }

  .eyebrow{
    font-size:0.72rem;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:var(--cream);
    opacity:0.85;
    margin-bottom:22px;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:400;
    font-style:italic;
    font-size:clamp(2.6rem, 7vw, 5.4rem);
    line-height:1.05;
    max-width:16ch;
    margin-bottom:34px;
  }

  .hero p{
    max-width:46ch;
    font-size:1rem;
    line-height:1.7;
    font-weight:300;
    color:var(--cream);
    opacity:0.9;
    margin-bottom:40px;
  }

  /* ---------- FOOTER ---------- */
  footer{
    text-align:center;
    padding:28px 24px 34px;
    font-size:0.7rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--cream);
    opacity:0.75;
  }

  @media (max-width: 640px){
    header{ padding:26px 20px; justify-content:center; text-align:center; }
    nav{ justify-content:center; }
    .btn{ padding:12px 22px; font-size:0.68rem; }
  }
</style>
</head>
<body>

  <div class="backdrop"></div>

  <div class="page">

    <header>
      <a href="#" class="logo">Luxury Indulge</a>
    </header>

    <main class="hero">
      <h1>Coming Soon...</h1>
	<nav>
        	<a href="brochure.pdf" class="btn" target="_blank">Membership Brochure</a>
        	<a href="register.html" class="btn btn-solid">Register Your Interest</a>
      </nav>
    </main>

    <footer>
      &copy; By Serena Govind 2026
    </footer>

  </div>

</body>
</html>
