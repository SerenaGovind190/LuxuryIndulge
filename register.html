<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Luxury Indulge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #2f3a44;
    --cream: #f7f1e2;
    --line: rgba(247,241,226,0.55);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }

  body{
    font-family:'Jost', sans-serif;
    color:var(--cream);
    background:#a8bac9;
    min-height:100vh;
  }

  .backdrop{
    position:fixed;
    inset:0;
    background-image:url('blue.png');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    z-index:-2;
  }

  .backdrop::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(20,30,40,0.35) 0%, rgba(20,30,40,0.15) 30%, rgba(20,30,40,0.35) 100%);
  }

  .page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }

  /* ---------- NAV ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    padding:36px 48px;
    flex-wrap:wrap;
  }

  .logo{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size:1.6rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    text-decoration:none;
    color:var(--cream);
  }

  header a.back{
    font-size:0.72rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--cream);
    text-decoration:none;
    opacity:0.85;
    border-bottom:1px solid var(--line);
    padding-bottom:2px;
  }

  header a.back:hover{ opacity:1; }

  /* ---------- MAIN ---------- */
  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px 24px 50px;
  }

  .card{
    width:100%;
    max-width:460px;
    text-align:center;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:400;
    font-style:italic;
    font-size:clamp(2.2rem, 5vw, 3rem);
    line-height:1.1;
    margin-bottom:14px;
  }

  .card > p{
    font-size:0.95rem;
    font-weight:300;
    line-height:1.7;
    opacity:0.9;
    max-width:38ch;
    margin:0 auto 40px;
  }

  form{
    display:flex;
    flex-direction:column;
    gap:20px;
    text-align:left;
  }

  .field{
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  label{
    font-size:0.68rem;
    letter-spacing:0.2em;
    text-transform:uppercase;
    opacity:0.8;
  }

  input{
    font-family:'Jost', sans-serif;
    font-size:0.95rem;
    font-weight:300;
    color:var(--cream);
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    padding:8px 2px;
    outline:none;
    transition:border-color 0.3s ease;
  }

  input::placeholder{ color:var(--cream); opacity:0.45; }

  input:focus{ border-color:var(--cream); }

  /* ---------- BUTTON ---------- */
  .btn{
    display:inline-block;
    font-family:'Jost', sans-serif;
    font-size:0.72rem;
    font-weight:500;
    letter-spacing:0.22em;
    text-transform:uppercase;
    text-decoration:none;
    color:#3a4552;
    background:var(--cream);
    border:1px solid var(--cream);
    border-radius:2px;
    padding:14px 30px;
    cursor:pointer;
    transition:background 0.35s ease, color 0.35s ease, border-color 0.35s ease;
    margin-top:10px;
  }

  .btn:hover{
    background:transparent;
    color:var(--cream);
    border-color:var(--line);
  }

  .note{
    margin-top:26px;
    font-size:0.75rem;
    font-weight:300;
    opacity:0.7;
    text-align:center;
  }

  .confirmation{
    display:none;
  }

  .confirmation.show{
    display:block;
  }

  .confirmation p{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:clamp(1.6rem, 4vw, 2.2rem);
    font-weight:400;
    line-height:1.3;
  }

  form.hide{
    display:none;
  }

  /* ---------- FOOTER ---------- */
  footer{
    text-align:center;
    padding:24px 24px 30px;
    font-size:0.7rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    opacity:0.75;
  }

  @media (max-width: 640px){
    header{ padding:26px 20px; justify-content:center; text-align:center; }
  }
</style>
</head>
<body>

  <div class="backdrop"></div>

  <div class="page">

    <header>
      <a href="index.html" class="logo">Luxury Indulge</a>
      <a href="index.html" class="back">&larr; Back to Home</a>
    </header>

    <main>
      <div class="card">
        <h1 id="formTitle">Register your interest</h1>
        <p id="formIntro">Join our emailing list to receive updates on membership.</p>

        <form id="registerForm">
          <div class="field">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>
          </div>

          <div class="field">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>
          </div>

          <div class="field">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required>
          </div>

          <button type="submit" class="btn">Register</button>
        </form>

        <p class="note" id="formNote">By registering, you agree to be contacted by our membership team.</p>

        <div class="confirmation" id="confirmation">
          <p>Thank you! you've been added to the list.</p>
        </div>
      </div>
    </main>

    <footer>
      &copy; By Serena Govind 2026
    </footer>

  </div>

  <script>
    // CONFIG: replace with the URL of your deployed Apps Script web app (see README/instructions in the repo)
    const SHEET_ENDPOINT = 'PASTE_YOUR_APPS_SCRIPT_URL_HERE';

    const form = document.getElementById('registerForm');
    const note = document.getElementById('formNote');
    const title = document.getElementById('formTitle');
    const intro = document.getElementById('formIntro');
    const confirmation = document.getElementById('confirmation');

    // Save locally and POST to the central Google Sheet endpoint (if configured)
    form.addEventListener('submit', function(e){
      e.preventDefault();

      const entry = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        date: new Date().toISOString().slice(0, 10)
      };

      // Local storage fallback
      const stored = JSON.parse(localStorage.getItem('beyondRegistrations') || '[]');
      stored.push(entry);
      localStorage.setItem('beyondRegistrations', JSON.stringify(stored));

      // Try to POST to central sheet (if endpoint configured)
      if(SHEET_ENDPOINT && SHEET_ENDPOINT.startsWith('https')){
        fetch(SHEET_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(entry)
        }).then(res => res.json()).then(data => {
          // optionally show success from server
          console.log('Sheet response:', data);
        }).catch(err => {
          console.warn('Could not post to sheet endpoint:', err);
        });
      }

      title.style.display = 'none';
      intro.style.display = 'none';
      form.classList.add('hide');
      note.style.display = 'none';
      confirmation.classList.add('show');
    });
  </script>

</body>
</html>
