<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brochure</title>
  <style>
    :root{ --cream:#f7f1e2; --ink:#2f3a44; }
    html,body{ height:100%; margin:0; background:#111; color:var(--cream); font-family:Arial, sans-serif; }
    .wrap{ display:flex; flex-direction:column; height:100%; }
    header{ padding:12px 18px; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:space-between; }
    header a{ color:var(--cream); text-decoration:none; font-weight:600 }
    .viewer{ flex:1; display:flex; }
    iframe{ width:100%; height:100%; border:none; }
    .fallback{ padding:24px; text-align:center; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>Brochure</div>
      <div><a href="brochure.pdf" download>Download PDF</a></div>
    </header>
    <main class="viewer">
      <iframe src="brochure.pdf" title="Brochure PDF"></iframe>
    </main>
    <noscript class="fallback">
      <p>Please enable JavaScript to view the brochure, or <a href="brochure.pdf">download it here</a>.</p>
    </noscript>
  </div>
</body>
</html>
